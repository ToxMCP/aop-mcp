name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Locked dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install locked security tools
        run: uv sync --locked --group security
      - name: Export every locked runtime, development and security dependency
        run: uv export --locked --all-extras --all-groups --no-emit-project --no-hashes --output-file audit-requirements.txt
      - name: Export isolated locked legacy-client dependencies
        run: uv export --locked --project tests/compatibility/legacy-client --no-emit-project --no-hashes --output-file legacy-client-audit.txt
      - name: Audit isolated legacy-client lock
        run: uv run --no-sync pip-audit --strict --desc --disable-pip --no-deps --requirement legacy-client-audit.txt
      - name: Audit locked dependencies and fail on collection errors
        run: uv run --no-sync pip-audit --strict --desc --disable-pip --no-deps --requirement audit-requirements.txt

  sast:
    name: Bandit SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install locked security tools
        run: uv sync --locked --group security
      - name: Check medium/high severity and confidence findings
        run: uv run --no-sync bandit --recursive src --severity-level medium --confidence-level medium
