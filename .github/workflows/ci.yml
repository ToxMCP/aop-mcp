name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    env:
      AOP_MCP_ENABLE_FIXTURE_FALLBACK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Check tracked files for secrets
        run: uv run --no-sync python scripts/check_no_secrets.py

      - name: Verify source tree compiles
        run: uv run --no-sync python -m compileall src tests scripts

  runtime-contract:
    name: Runtime Contract
    runs-on: ubuntu-latest

    env:
      AOP_MCP_ENABLE_FIXTURE_FALLBACK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Validate schema-heavy regression surface
        run: |
          uv run --no-sync pytest tests/unit/test_schema_validation.py tests/unit/test_mcp_smoke.py -q

  installed-wheel:
    name: Installed Wheel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Build wheel from the source distribution
        run: uv build
      - name: Install locked runtime and wheel outside the checkout
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes --output-file "$RUNNER_TEMP/aop-runtime.txt"
          uv venv "$RUNNER_TEMP/aop-wheel"
          uv pip install --python "$RUNNER_TEMP/aop-wheel/bin/python" --requirement "$RUNNER_TEMP/aop-runtime.txt" dist/*.whl
      - name: Install isolated locked legacy client
        run: uv sync --locked --project tests/compatibility/legacy-client
      - name: Verify installed MCP, schemas, templates and offline fixtures
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/aop-wheel/bin/python" -I "$GITHUB_WORKSPACE/scripts/verify_installed_wheel.py"
          "$RUNNER_TEMP/aop-wheel/bin/python" -I "$GITHUB_WORKSPACE/scripts/verify_protocol_clients.py" \
            --server-python "$RUNNER_TEMP/aop-wheel/bin/python" \
            --legacy-python "$GITHUB_WORKSPACE/tests/compatibility/legacy-client/.venv/bin/python" \
            --output-dir "$RUNNER_TEMP/aop-client-results"

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build hosted runtime image
        run: docker build -t aop-mcp:ci .

      - name: Verify app import inside image
        run: docker run --rm --entrypoint python aop-mcp:ci -c "import src.server.api.server"

      - name: Smoke health endpoint
        run: |
          container_id="$(docker run -d -p 8003:8000 aop-mcp:ci)"
          cleanup() {
            docker rm -f "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8003/health; then
              exit 0
            fi
            sleep 1
          done

          docker logs "$container_id"
          exit 1

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      AOP_MCP_ENABLE_FIXTURE_FALLBACK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # The Track-B governance tests (tests/governance/) shell out to the vendored
      # spine policy engine via a fail-closed Node bridge, so the test job needs Node.
      - name: Setup Node (spine-engine bridge)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Check tracked files for secrets
        run: uv run --no-sync python scripts/check_no_secrets.py

      - name: Run unit tests
        run: uv run --no-sync pytest -q

      - name: Verify package imports
        run: uv run --no-sync python -c "import src.server.api.server"

  # ---------------------------------------------------------------------------
  # Track-B scientific-invariants gate (advisory)
  #
  # Projects the RELEASED aop-mcp assess_aop_confidence.response (an AOP confidence
  # assessment) onto its canonical ToxMCP schema-spine shapes (ClaimRecord +
  # EvidenceAnchor) and runs the vendored, digest-pinned spine policy engine over the
  # projection via a fail-closed Node bridge. It BLOCKS (exit non-zero) on any
  # release-blocking code: scientific anti-overclaim (FREE_TEXT_OVERCLAIM,
  # ABSOLUTE_OR_REGULATORY_OVERCLAIM, CONTEXT_ONLY_OVERCLAIM, AOP_CONTEXT_NOT_KER_EVIDENCE)
  # or meta fail-closed (SOURCE_CONTRACT_VIOLATION, ENGINE_UNAVAILABLE,
  # UNRECOGNIZED_SPINE_SCHEMA_ID, VENDOR_DIGEST_MISMATCH, PROJECTION_INCOMPLETE).
  #
  # aop-mcp's confidence assessment is deterministic + zero-LLM and natively issues an
  # interpretive, non-causal, non-regulatory conclusion, so the gate is GREEN on the
  # pristine corpus — it is a regression tripwire. This job sets up Node (the bridge
  # shells to the vendored engine) and runs vendor:verify FIRST (digest tamper-check).
  #
  # Advisory: no required-status-check on the free-plan repo. PROMOTE-TO-BLOCKING: when
  # the repo gains branch protection / rulesets, mark this job a required check — the
  # gate already exits non-zero on any blocking code.
  # ---------------------------------------------------------------------------
  scientific-invariants:
    name: Scientific Invariants (Track-B)
    runs-on: ubuntu-latest

    env:
      AOP_MCP_ENABLE_FIXTURE_FALLBACK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Setup Node (bridge shells to the vendored spine engine)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Verify vendored spine-engine digests (vendor:verify)
        run: uv run --no-sync python scripts/vendor_verify.py

      - name: Run Track-B governance test suite (per-code bites + guard + fail-closed)
        run: uv run --no-sync pytest tests/governance -q

      - name: Run scientific-invariants gate on the released corpus
        run: uv run --no-sync python scripts/scientific_invariants_gate.py
